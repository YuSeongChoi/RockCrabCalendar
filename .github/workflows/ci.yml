name: iOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Unit Tests
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test RockCrabShared module
        run: swift test --package-path RockCrabCalendar/Modules/RockCrabShared

      - name: Test RockCrabDomain module
        run: swift test --package-path RockCrabCalendar/Modules/RockCrabDomain

name: iOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Unit Tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Create Secrets.xcconfig
        run: |
          mkdir -p RockCrabCalendar/RockCrabCalendar/Config
          cat > RockCrabCalendar/RockCrabCalendar/Config/Secrets.xcconfig <<EOF
          YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
          QWER_CHANNEL_ID=${{ secrets.QWER_CHANNEL_ID }}
          HOLIDAY_API_KEY=${{ secrets.HOLIDAY_API_KEY }}
          EOF

      - name: Build app
        run: >
          xcodebuild
          -project RockCrabCalendar/RockCrabCalendar.xcodeproj
          -scheme RockCrabCalendar
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
          -skipPackagePluginValidation
          build

      - name: Run unit tests
        run: >
          xcodebuild
          -project RockCrabCalendar/RockCrabCalendar.xcodeproj
          -scheme RockCrabCalendar
          -only-testing:RockCrabCalendarUnitTests
          -skip-testing:RockCrabCalendarUITests
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
          -skipPackagePluginValidation
          -parallel-testing-enabled NO
          test

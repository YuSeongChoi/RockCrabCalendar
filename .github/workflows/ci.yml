name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  module-tests:
    name: ci / module-tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test shared/domain/data modules
        run: make test-modules

  app-unit-tests:
    name: ci / app-unit-tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: macos-15
    needs: module-tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Create CI Secrets.xcconfig
        run: |
          mkdir -p RockCrabCalendar/RockCrabCalendar/Config
          cat > RockCrabCalendar/RockCrabCalendar/Config/Secrets.xcconfig <<'EOF'
          YOUTUBE_API_KEY =
          QWER_CHANNEL_ID =
          HOLIDAY_API_KEY =
          EOF
      - name: Test app unit target (skip if empty)
        run: make test-app
